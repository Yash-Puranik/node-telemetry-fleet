name: CI/CD to Docker Hub

on:
  push:
    branches: [main, test-ci]
  pull_request:
    branches: [main, test-ci]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Build directly using host docker engine (no buildx daemon memory caps)
      - name: Build local image
        run: |
          docker build \
            -t node-telemetry-fleet:ci \
            -f services/node-service/Dockerfile \
            services/node-service

      - name: Run test container
        run: docker run -d -p 3000:3000 --name test-agent node-telemetry-fleet:ci

      - name: Output container status & logs
        run: |
          sleep 3
          docker ps -a
          docker logs test-agent

      - name: Verify health endpoint
        run: curl --retry 10 --retry-delay 2 --retry-connrefused -f http://localhost:3000/health

      - name: Log in to Docker Hub
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-ci') && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push to Docker Hub
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-ci') && github.event_name == 'push'
        run: |
          docker tag node-telemetry-fleet:ci ${{ secrets.DOCKERHUB_USERNAME }}/node-telemetry-fleet:latest
          docker tag node-telemetry-fleet:ci ${{ secrets.DOCKERHUB_USERNAME }}/node-telemetry-fleet:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/node-telemetry-fleet:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/node-telemetry-fleet:${{ github.sha }}