name: CI/CD to Docker Hub

on:
  push:
    branches: [main, test-ci]
  pull_request:
    branches: [main]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and load image into the runner for testing
      - name: Build local image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/node-service/Dockerfile
          load: true
          tags: node-telemetry-fleet:ci
    - name: Run test container
        run: docker run -d -p 3000:3000 --name test-agent node-telemetry-fleet:ci
    - name: Verify health endpoint
        run: |
          sleep 5
          curl -f http://localhost:3000/health || exit 1
    - name: Log in to Docker Hub
      - name: Run test container
        run: docker run -d -p 3000:3000 --name test-agent node-telemetry-fleet:ci
      - name: Verify health endpoint
        run: |
          sleep 5
          curl -f http://localhost:3000/health || exit 1
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push to Docker Hub
      - name: Build and push to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/node-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/node-telemetry-fleet:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/node-telemetry-fleet:${{ github.sha }}
