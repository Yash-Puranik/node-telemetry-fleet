name: CI/CD to Docker Hub

on:
  push:
    branches: [main, test-ci]
  pull_request:
    branches: [main, test-ci]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: node-telemetry-fleet:ci

      - name: Run test container
        run: docker run -d -p 3000:3000 --name test-agent node-telemetry-fleet:ci

      - name: Inspect container logs
        run: docker logs test-agent

      - name: Verify health endpoint
        run: curl --retry 10 --retry-delay 2 --retry-connrefused -f http://localhost:3000/health

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/test-ci' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        if: github.ref == 'refs/heads/test-ci' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/node-telemetry-fleet:latest,${{ secrets.DOCKERHUB_USERNAME }}/node-telemetry-fleet:${{ github.sha }}